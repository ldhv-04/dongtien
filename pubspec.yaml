name: dongtien
description: "DongTien - Production-ready, offline-first personal finance application for Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management (Standard Notifier / AsyncNotifier)
  flutter_riverpod: ^2.5.1

  # Persistence & Type-safe SQLite
  drift: ^2.20.0
  drift_flutter: 0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Scheduled Local Reminders & Timezone
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Localization & Formatting
  intl: ^0.19.0

  # Export & Import File Bridge
  share_plus: ^10.0.0
  file_picker: ^8.1.0

  # Authenticated Cryptography (PBKDF2-HMAC-SHA256, AES-256-GCM)
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  assets:
    - docs/design_refs/
